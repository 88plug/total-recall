name: release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Verify tag matches pyproject version
        run: |
          tag_version=${GITHUB_REF#refs/tags/v}
          pyproject_version=$(python - <<'PY'
          import tomllib
          d = tomllib.loads(open('pyproject.toml', 'rb').read().decode())
          print(d['project']['version'])
          PY
          )
          if [ "$tag_version" != "$pyproject_version" ]; then
            echo "ERROR: tag $tag_version != pyproject $pyproject_version"
            exit 1
          fi

      - name: validate plugin manifests
        run: |
          test -f .claude-plugin/plugin.json
          jq . .claude-plugin/plugin.json > /dev/null
          if [ -f .mcp.json ]; then jq . .mcp.json > /dev/null; fi
          if [ -f hooks/hooks.json ]; then jq . hooks/hooks.json > /dev/null; fi

      - name: install build tools
        run: pip install build twine

      - name: build sdist and wheel
        run: python -m build

      - name: twine check
        run: twine check dist/*

      - name: pack plugin zip
        id: pack
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          case "$VERSION" in
            *[!A-Za-z0-9._-]*)
              echo "invalid tag name: $VERSION" >&2
              exit 1
              ;;
          esac
          NAME="total-recall-${VERSION}"
          zip -r "dist/${NAME}.zip" . \
            -x ".git/*" \
            -x ".github/*" \
            -x "dist/*" \
            -x "tests/*" \
            -x "**/__pycache__/*" \
            -x "**/*.pyc" \
            -x ".ruff_cache/*" \
            -x ".pytest_cache/*" \
            -x ".mypy_cache/*"
          echo "zip=dist/${NAME}.zip" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Extract CHANGELOG section
        id: changelog
        run: |
          version=${GITHUB_REF#refs/tags/v}
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { capture=1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "ERROR: no CHANGELOG section found for [$version]" >&2
            exit 1
          fi
          cat release-notes.md

      - name: create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: release-notes.md
          draft: false
          prerelease: false
