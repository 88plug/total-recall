name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Linux only — plugin is Linux-first (Claude/Grok/plugin data dirs).
        # macos-latest was a fixed second axis and only slowed CI (shared GH mac pool).
        python: ["3.10", "3.11", "3.12"]
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "${{ matrix.python }}"

      - name: install
        run: pip install -e ".[dev]"

      - name: lint
        run: ruff check .

      - name: unit tests
        run: pytest -q --ignore=tests/integration

      - name: smoke-install plugin
        shell: python
        run: |
          import json, sys, pathlib
          files = ['.claude-plugin/plugin.json', '.mcp.json', 'hooks/hooks.json']
          for f in files:
              p = pathlib.Path(f)
              if not p.exists():
                  print(f'MISSING: {f}', file=sys.stderr); sys.exit(1)
              json.loads(p.read_text())
              print(f'OK: {f}')

      - name: command frontmatter parses
        shell: python
        run: |
          import pathlib, sys
          try:
              import yaml
          except ImportError:
              import subprocess
              subprocess.check_call([sys.executable, "-m", "pip", "install", "pyyaml"])
              import yaml
          bad = []
          for md in pathlib.Path("commands").glob("*.md"):
              text = md.read_text()
              if not text.startswith("---"):
                  continue
              _, fm, _ = text.split("---", 2)
              try:
                  yaml.safe_load(fm)
              except Exception as e:
                  bad.append(f"{md}: {e}")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print("all command frontmatter parses")

  packaging:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.13"

      - name: install build tools
        run: pip install build twine

      - name: build sdist and wheel
        run: python -m build

      - name: twine check
        run: twine check dist/*
