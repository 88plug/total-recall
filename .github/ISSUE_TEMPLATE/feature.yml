name: Feature request
description: Suggest a new capability or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Describe the feature you'd like to see in total-recall.

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What problem does this solve? Who benefits and how?
      placeholder: When I do X I have to Y, which is tedious because Z.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should the new behavior look like? Include CLI/API sketch if possible.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or alternative approaches have you tried?

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Links, related issues, screenshots, etc.
