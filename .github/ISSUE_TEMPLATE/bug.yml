name: Bug report
description: Something is broken or behaving unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Fill in as much detail as you can.

  - type: input
    id: cli
    attributes:
      label: CLI / shell
      description: Which shell or CLI are you using? (e.g. Claude Code, bash, zsh)
      placeholder: Claude Code v1.x.x / bash 5.2
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: total-recall version
      description: Run `total-recall --version` or check `pyproject.toml`
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS and Python version
      placeholder: "macOS 14 / Python 3.12"
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Minimal steps to reproduce the issue
      placeholder: |
        1. Run `...`
        2. Observe `...`
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Log excerpt
      description: Paste the relevant portion of output or error trace
      render: text
