[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "total-recall"
version = "2.3.18"
description = "Cross-session, cross-CLI memory for AI coding assistants. Mines transcripts from 10 supported CLI clients; surfaces operator identity / decisions / bans / corrections via MCP."
readme = "README.md"
license = "LicenseRef-FSL-1.1-ALv2"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "88plug", email = "andrew@88plug.com"},
]
keywords = [
    "claude-code",
    "memory",
    "recall",
    "session-logs",
    "cross-session",
    "mcp",
    "hooks",
    "data-mining",
    "ai-coding",
    "operator-profile",
    "opencode",
    "gemini-cli",
    "codex",
    "cursor",
    "continue",
    "cline",
    "aider",
    "goose",
    "grok",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
    "Environment :: Plugins",
]
dependencies = [
    # 2.x floor: mcp 2.0.0 moved the server entrypoint
    # `mcp.server.fastmcp.FastMCP` → `mcp.server.mcpserver.MCPServer`. We import
    # the 2.x path, so 1.x can no longer satisfy this.
    "mcp>=2.0.0",
    "click>=8",
    "sqlite-vec>=0.1.9",  # distance_metric=cosine column option; PyPI latest 0.1.9
    # Dense embeds: product-owned ollama binary (GitHub ollama/ollama latest 0.32.1).
]

[project.optional-dependencies]
vec = []  # bundled in core since v2.3.0; kept for backwards compatibility
llm = []  # ollama is a managed external binary, not a Python package dep
dev = [
    "tomli; python_version < '3.11'",
    "pytest>=9",
    "pytest-cov>=7",
    "ruff>=0.15",
    "mypy>=2",
    "build>=1.5",
    "twine>=6",
    "mkdocs-material>=9.5",
]

[dependency-groups]
docs = [
    "mkdocs-material>=9.5",
]
dev = [
    { include-group = "docs" },
    "tomli; python_version < '3.11'",
    "pytest>=9",
    "pytest-cov>=7",
    "ruff>=0.15",
    "mypy>=2",
    "build>=1.5",
    "twine>=6",
]

[project.urls]
Homepage = "https://github.com/88plug/total-recall"
Documentation = "https://88plug.github.io/total-recall/"
Repository = "https://github.com/88plug/total-recall"
Issues = "https://github.com/88plug/total-recall/issues"
Changelog = "https://github.com/88plug/total-recall/blob/main/CHANGELOG.md"

[project.scripts]
total-recall = "total_recall.__main__:cli"
total-recall-mcp = "total_recall.mcp_entry:main"

[tool.setuptools.packages.find]
include = ["total_recall*", "lib*", "extractors*", "index*", "vec*", "mcp_server*", "detector*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# One-shot eval harnesses — long prompt/JSON lines; keep lint rules, not E501.
"scripts/eval_*.py" = ["E501"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
