[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "total-recall"
version = "2.3.0"
description = "Cross-session, cross-CLI memory for AI coding assistants. Mines transcripts from 10 supported CLI clients; surfaces operator identity / decisions / bans / corrections via MCP."
readme = "README.md"
license = "LicenseRef-FSL-1.1-ALv2"
license-files = ["LICENSE.md"]
requires-python = ">=3.10"
authors = [
    {name = "88plug", email = "claude@cryptoandcoffee.com"},
]
keywords = [
    "claude-code",
    "memory",
    "recall",
    "session-logs",
    "cross-session",
    "mcp",
    "hooks",
    "data-mining",
    "ai-coding",
    "operator-profile",
    "opencode",
    "gemini-cli",
    "codex",
    "cursor",
    "continue",
    "cline",
    "aider",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
    "Environment :: Plugins",
]
dependencies = [
    "mcp>=1.28.0",
    "click>=8",
    "fastembed>=0.4",
    "sqlite-vec>=0.1.6",
]

[project.optional-dependencies]
vec = []  # bundled in core since v2.3.0; kept for backwards compatibility
llm = []  # ollama is an external daemon binary, not a Python package; no pip dep needed
dev = [
    "tomli; python_version < '3.11'",
    "pytest>=9",
    "pytest-cov>=7",
    "ruff>=0.15",
    "mypy>=2",
    "build>=1.5",
    "twine>=6",
]

[project.urls]
Homepage = "https://github.com/88plug/total-recall"
Documentation = "https://github.com/88plug/total-recall#readme"
Repository = "https://github.com/88plug/total-recall"
Issues = "https://github.com/88plug/total-recall/issues"
Changelog = "https://github.com/88plug/total-recall/blob/main/CHANGELOG.md"

[project.scripts]
total-recall = "total_recall.__main__:cli"
total-recall-mcp = "total_recall.mcp_entry:main"

[tool.setuptools.packages.find]
include = ["total_recall*", "lib*", "extractors*", "index*", "vec*", "mcp_server*", "detector*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
