site_name: Total Recall
site_description: 'Cross-session memory for Claude Code and AI coding assistants — mines your own transcripts so new sessions already know decisions, bans, corrections, and goals.'
site_url: https://88plug.github.io/total-recall/
repo_url: https://github.com/88plug/total-recall
repo_name: 88plug/total-recall
edit_uri: edit/main/docs/
use_directory_urls: true
strict: true

nav:
  - Home: index.md
  - Install:
    - Overview: install/README.md
    - Claude Code: install/claude_code.md
    - OpenCode: install/opencode.md
    - Gemini CLI: install/gemini_cli.md
    - Codex CLI: install/codex.md
    - Cursor: install/cursor.md
    - Continue: install/continue.md
    - Cline: install/cline.md
    - Aider: install/aider.md
    - Goose: install/goose.md
    - Grok: install/grok.md
  - Architecture: architecture.md
  - Local-LLM refinement: llm-refinement.md
  - Dense embeddings: embeddings.md
  - Ollama GPU: ollama-gpu.md
  - Marketplace: marketplace.md
  - CI/CD: ci.md

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - toc:
      permalink: true

plugins:
  - search
