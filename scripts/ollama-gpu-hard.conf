# systemd drop-in: hammer Ollama on NVIDIA GPUs (total-recall / local LLM)
# Install (once):
#   sudo cp scripts/ollama-gpu-hard.conf /etc/systemd/system/ollama.service.d/99-gpu-hard.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart ollama
# Verify:
#   ollama ps          # PROCESSOR column → 100% GPU
#   nvidia-smi
#
# Both Ada cards visible — ollama puts a model on one GPU if it fits entirely
# (best perf); spreads only when a model won't fit one card.

[Service]
# Prefer explicit UUIDs (stable across reboot). Both GPUs:
Environment="CUDA_DEVICE_ORDER=PCI_BUS_ID"
Environment="CUDA_VISIBLE_DEVICES=GPU-a7b0c3ae-a48b-4244-ba87-fe0922f2b9c2,GPU-4da30622-4d34-c4ab-208e-8eac0c4d4533"

# Concurrent load: embed + chat can coexist when VRAM allows
Environment="OLLAMA_MAX_LOADED_MODELS=4"
# Parallel requests per model (scales VRAM by parallel * ctx — keep sane)
Environment="OLLAMA_NUM_PARALLEL=4"
Environment="OLLAMA_MAX_QUEUE=2048"
# Pin models until explicit ollama stop (no 5m unload mid-backfill)
Environment="OLLAMA_KEEP_ALIVE=-1"
# Flash attention when supported (lower KV memory, better long ctx; pairs with MTP)
Environment="OLLAMA_FLASH_ATTENTION=1"
# Multi-token prediction (MTP) draft depth — MLX knobs; CUDA auto-enables
# built-in MTP heads on Qwen3.5 / similar GGUFs that ship mtp.* tensors.
Environment="OLLAMA_MLX_MTP_MAX_DRAFT_TOKENS=4"
Environment="OLLAMA_MLX_MTP_INITIAL_DRAFT_TOKENS=4"
# Optional: q8_0 KV cache saves VRAM with tiny quality hit
# Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
